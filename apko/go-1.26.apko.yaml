# Go 1.26 runtime (active): with git, sh and bash shells; runs as
# nonroot (1000:1000). Packages are not pinned: every build takes the current Wolfi packages, and the
# release workflow publishes a new version only when the resulting image differs from the last one.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - go-1.26-upstream
    - git
    - busybox
    - bash

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 1000

paths:
  - path: /app
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /go
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /app

entrypoint:
  command: /usr/bin/go

environment:
  PATH: /go/bin:/usr/local/go/bin:/usr/sbin:/usr/bin:/sbin:/bin
  GOPATH: /go
  GOCACHE: /app/.cache/go-build
  GOMODCACHE: /go/pkg/mod
  GODEBUG: tarinsecurepath=0,zipinsecurepath=0
  GOTOOLCHAIN: local+auto
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: Go 1.26
  org.opencontainers.image.description: Minimal, non-root Go 1.26 container image on Wolfi with git, sh and bash. Verified upstream go.dev binary.
  org.opencontainers.image.url: https://github.com/Pair-AI-Platform/go
  org.opencontainers.image.documentation: https://pair-ai-platform.github.io/go/
  org.opencontainers.image.source: https://github.com/Pair-AI-Platform/go

archs:
  - x86_64
  - aarch64

