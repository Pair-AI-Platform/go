# Go 1.25 development (extended maintenance): standard Go toolchain plus git, sh, bash, and
# build-base (gcc, g++, make, binutils), pkgconf, openssh-client and python3 for CGO and
# native module builds. Ship compiled applications on minimal runtime or distroless images.
# Runs as nonroot (1000:1000).
# Go 1.25 itself is go-1.25-upstream, the official go.dev binaries built by
# melange/go-1.25-upstream.yaml (see docs/GO-SOURCES.md).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - go-1.25-upstream
    - git
    - busybox
    - bash
    - build-base
    - pkgconf
    - python3
    - openssh-client

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 1000

paths:
  - path: /app
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /go
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /app

entrypoint:
  command: /usr/bin/go

environment:
  PATH: /go/bin:/usr/local/go/bin:/usr/sbin:/usr/bin:/sbin:/bin
  GOPATH: /go
  GOCACHE: /app/.cache/go-build
  GOMODCACHE: /go/pkg/mod
  GODEBUG: tarinsecurepath=0,zipinsecurepath=0
  GOTOOLCHAIN: local+auto
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: Go 1.25 (LTS Development)
  org.opencontainers.image.description: Go 1.25 LTS development image on Wolfi with build-base (gcc, make), pkgconf, git and CGO toolchain. Non-root. Verified upstream go.dev binary.
  org.opencontainers.image.url: https://github.com/Pair-AI-Platform/go
  org.opencontainers.image.documentation: https://pair-ai-platform.github.io/go/
  org.opencontainers.image.source: https://github.com/Pair-AI-Platform/go

archs:
  - x86_64
  - aarch64

